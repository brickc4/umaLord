# Build and test on every push to main and every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows is what releases ship for; Linux (Wayland) and macOS build from source.
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - name: Build
        working-directory: app
        run: cargo build --release --locked
      - name: Test
        # Includes the race engine's check against umalator.app (sim::tests::matches_moomoolator).
        working-directory: app
        run: cargo test --release --locked
      - name: Check the knowledge updater compiles
        run: python -m py_compile tools/update_knowledge.py
